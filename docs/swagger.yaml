basePath: /api
definitions:
  dto.CreateCinemaRequest:
    properties:
      address:
        type: string
      city:
        maxLength: 100
        minLength: 2
        type: string
      name:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - address
    - city
    - name
    type: object
  dto.CreateMovieRequest:
    properties:
      age_rating:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      genre:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - duration_minutes
    - title
    type: object
  dto.CreateSeatRequest:
    properties:
      seat_number:
        maxLength: 20
        minLength: 1
        type: string
      studio_id:
        type: string
    required:
    - seat_number
    - studio_id
    type: object
  dto.CreateShowtimeRequest:
    properties:
      cinema_id:
        type: string
      end_time:
        type: string
      movie_id:
        type: string
      price:
        type: number
      start_time:
        type: string
      studio_id:
        type: string
    required:
    - cinema_id
    - end_time
    - movie_id
    - price
    - start_time
    - studio_id
    type: object
  dto.CreateStudioRequest:
    properties:
      cinema_id:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      rows:
        maximum: 26
        type: integer
      seats_per_row:
        maximum: 50
        type: integer
    required:
    - cinema_id
    - name
    - rows
    - seats_per_row
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 150
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateCinemaRequest:
    properties:
      address:
        type: string
      city:
        maxLength: 100
        minLength: 2
        type: string
      name:
        maxLength: 150
        minLength: 3
        type: string
    required:
    - address
    - city
    - name
    type: object
  dto.UpdateMovieRequest:
    properties:
      age_rating:
        type: string
      description:
        type: string
      duration_minutes:
        type: integer
      genre:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - duration_minutes
    - title
    type: object
  dto.UpdateSeatRequest:
    properties:
      seat_number:
        maxLength: 20
        minLength: 1
        type: string
      studio_id:
        type: string
    required:
    - seat_number
    - studio_id
    type: object
  dto.UpdateShowtimeRequest:
    properties:
      cinema_id:
        type: string
      end_time:
        type: string
      movie_id:
        type: string
      price:
        type: number
      start_time:
        type: string
      status:
        enum:
        - SCHEDULED
        - ONGOING
        - COMPLETED
        - CANCELLED
        type: string
      studio_id:
        type: string
    required:
    - cinema_id
    - end_time
    - movie_id
    - price
    - start_time
    - status
    - studio_id
    type: object
  dto.UpdateStudioRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      rows:
        maximum: 26
        type: integer
      seats_per_row:
        maximum: 50
        type: integer
    required:
    - name
    - rows
    - seats_per_row
    type: object
  response.Response:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
