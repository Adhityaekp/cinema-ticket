      summary: Update jadwal tayang
      tags:
      - Showtimes
  /studios:
    get:
      description: Mendapatkan semua studio
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get all studios
      tags:
      - Studios
    post:
      consumes:
      - application/json
      description: Membuat studio baru
      parameters:
