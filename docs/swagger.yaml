      summary: Get jadwal tayang berdasarkan ID
      tags:
      - Showtimes
    put:
      consumes:
      - application/json
      description: Mengubah data jadwal tayang.
      parameters:
      - description: Showtime ID
        in: path
        name: id
        required: true
        type: string
      - description: Update showtime request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateShowtimeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
